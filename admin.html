<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
'https://script.google.com/macros/s/AKfycbzRwSD1xs75XXNwE_R51TIu_QKrKuon-aEcezM5cbqzevBSuQuhuqkYfN8Ozq_B1CR1/exec';

const SCRFD_MODEL =
'./model/scrfd_500m_bnkps.onnx';

const ARCFACE_MODEL =
'./model/w600k_mbf.onnx';

const INPUT_SIZE = 640;

const FACE_SIZE = 112;

const DET_THRESHOLD = 0.50;

const STRIDES = [8,16,32];


/* =========================================================
   DOM
========================================================= */

const video =
document.getElementById('video');

const canvas =
document.getElementById('canvas');

const ctx =
canvas.getContext('2d');

const statusBox =
document.getElementById('status');

const challenge =
document.getElementById('challenge');

const startBtn =
document.getElementById('startBtn');

const stopBtn =
document.getElementById('stopBtn');

const saveBtn =
document.getElementById('saveBtn');

const resetBtn =
document.getElementById('resetBtn');

const scrfdStatus =
document.getElementById('scrfdStatus');

const arcStatus =
document.getElementById('arcStatus');

const faceStatus =
document.getElementById('faceStatus');

const embeddingStatus =
document.getElementById('embeddingStatus');

const liveStatus =
document.getElementById('liveStatus');


/* =========================================================
   STATE
========================================================= */

let scrfdSession = null;

let arcfaceSession = null;

let stream = null;

let running = false;

let processing = false;

let embeddingReady = false;

let currentEmbedding = null;


/* =========================================================
   LIVENESS
========================================================= */

let previousX = null;

let previousY = null;

let movementTotal = 0;

let movementFrames = 0;

let livenessPassed = false;


function resetLiveness(){

    previousX = null;

    previousY = null;

    movementTotal = 0;

    movementFrames = 0;

    livenessPassed = false;

    liveStatus.textContent =
        'CHƯA XÁC THỰC';

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    type
){

    statusBox.className =
        'status ' + type;

    statusBox.textContent =
        text;

}


/* =========================================================
   LOAD AI
========================================================= */

async function loadAI(){

    try{

        setStatus(
            '⏳ Đang tải SCRFD...',
            'yellow'
        );


        scrfdSession =
            await ort.InferenceSession.create(

                SCRFD_MODEL,

                {
                    executionProviders:[
                        'wasm'
                    ]
                }

            );


        scrfdStatus.textContent =
            'HOẠT ĐỘNG';


        setStatus(
            '⏳ Đang tải ArcFace...',
            'yellow'
        );


        arcfaceSession =
            await ort.InferenceSession.create(

                ARCFACE_MODEL,

                {
                    executionProviders:[
                        'wasm'
                    ]
                }

            );


        arcStatus.textContent =
            'HOẠT ĐỘNG';


        setStatus(
            '✅ AI SẴN SÀNG',
            'green'
        );


        challenge.textContent =
            'Nhập thông tin nhân sự rồi bắt đầu camera.';


    }
    catch(error){

        console.error(error);


        setStatus(
            '❌ Lỗi tải AI: ' +
            error.message,
            'red'
        );


        challenge.textContent =
            'Không thể tải mô hình AI.';

    }

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    if(
        !scrfdSession ||
        !arcfaceSession
    ){

        setStatus(
            '⏳ AI chưa tải xong.',
            'yellow'
        );

        return;

    }


    if(running)
        return;


    try{

        stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{

                    facingMode:'user',

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }

                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        running = true;

        processing = false;


        currentEmbedding = null;

        embeddingReady = false;


        saveBtn.disabled = true;


        faceStatus.textContent =
            'CHƯA TẠO';


        embeddingStatus.textContent =
            'CHƯA CÓ';


        resetLiveness();


        setStatus(
            '🟢 CAMERA ĐANG HOẠT ĐỘNG',
            'green'
        );


        challenge.textContent =
            '🔐 Đưa khuôn mặt vào giữa camera';


        detectLoop();


    }
    catch(error){

        console.error(error);


        setStatus(
            '❌ Không mở được camera: ' +
            error.message,
            'red'
        );

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera(){

    running = false;

    processing = false;


    if(stream){

        stream
            .getTracks()
            .forEach(
                track =>
                track.stop()
            );

        stream = null;

    }


    video.srcObject = null;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    resetLiveness();


    challenge.textContent =
        'Camera đã dừng.';


}


/* =========================================================
   FRAME
========================================================= */

function getFrame(){

    const c =
        document.createElement(
            'canvas'
        );


    c.width =
        video.videoWidth;


    c.height =
        video.videoHeight;


    c.getContext('2d')
        .drawImage(

            video,

            0,
            0,

            c.width,
            c.height

        );


    return c;

}


/* =========================================================
   LETTERBOX
========================================================= */

function letterbox(
    source,
    size
){

    const scale =
        Math.min(

            size / source.width,

            size / source.height

        );


    const width =
        Math.round(
            source.width *
            scale
        );


    const height =
        Math.round(
            source.height *
            scale
        );


    const c =
        document.createElement(
            'canvas'
        );


    c.width = size;

    c.height = size;


    const g =
        c.getContext('2d');


    g.fillStyle =
        'rgb(127,127,127)';


    g.fillRect(
        0,
        0,
        size,
        size
    );


    const ox =
        (size-width)/2;


    const oy =
        (size-height)/2;


    g.drawImage(

        source,

        ox,
        oy,

        width,
        height

    );


    return {

        canvas:c,

        scale:scale,

        ox:ox,

        oy:oy

    };

}


/* =========================================================
   IMAGE → TENSOR
========================================================= */

function imageTensor(c){

    const image =
        c.getContext('2d')
        .getImageData(

            0,
            0,

            c.width,
            c.height

        );


    const area =
        c.width *
        c.height;


    const data =
        new Float32Array(
            area * 3
        );


    for(
        let i=0;
        i<area;
        i++
    ){

        const p =
            i * 4;


        data[i] =
            (
                image.data[p] -
                127.5
            ) / 128;


        data[area+i] =
            (
                image.data[p+1] -
                127.5
            ) / 128;


        data[area*2+i] =
            (
                image.data[p+2] -
                127.5
            ) / 128;

    }


    return new ort.Tensor(

        'float32',

        data,

        [
            1,
            3,
            c.height,
            c.width
        ]

    );

}


/* =========================================================
   OUTPUT
========================================================= */

function findOutput(
    outputs,
    name
){

    const keys =
        Object.keys(
            outputs
        );


    const key =
        keys.find(
            k =>
            k.toLowerCase()
             .includes(
                 name.toLowerCase()
             )
        );


    return key
        ? outputs[key]
        : null;

}


/* =========================================================
   SCRFD DECODER
========================================================= */

function decodeSCRFD(
    outputs
){

    const detections = [];


    for(
        const stride
        of STRIDES
    ){

        const score =
            findOutput(
                outputs,
                'score_' +
                stride
            );


        const bbox =
            findOutput(
                outputs,
                'bbox_' +
                stride
            );


        if(
            !score ||
            !bbox
        )
            continue;


        const scores =
            score.data;


        const boxes =
            bbox.data;


        const count =
            Math.min(

                scores.length,

                Math.floor(
                    boxes.length / 4
                )

            );


        const grid =
            Math.ceil(
                INPUT_SIZE /
                stride
            );


        for(
            let i=0;
            i<count;
            i++
        ){

            const confidence =
                Number(
                    scores[i]
                );


            if(
                confidence <
                DET_THRESHOLD
            )
                continue;


            const cell =
                Math.floor(
                    i / 2
                );


            const gx =
                cell % grid;


            const gy =
                Math.floor(
                    cell / grid
                );


            const b =
                i * 4;


            const x1 =
                gx * stride -
                boxes[b] *
                stride;


            const y1 =
                gy * stride -
                boxes[b+1] *
                stride;


            const x2 =
                gx * stride +
                boxes[b+2] *
                stride;


            const y2 =
                gy * stride +
                boxes[b+3] *
                stride;


            detections.push({

                score:confidence,

                x1:x1,
                y1:y1,

                x2:x2,
                y2:y2

            });

        }

    }


    if(
        !detections.length
    )
        return null;


    detections.sort(
        (a,b) =>
        b.score-a.score
    );


    return detections[0];

}


/* =========================================================
   DETECT FACE
========================================================= */

async function detectFace(
    frame
){

    const lb =
        letterbox(
            frame,
            INPUT_SIZE
        );


    const tensor =
        imageTensor(
            lb.canvas
        );


    const inputName =
        scrfdSession.inputNames[0];


    const outputs =
        await scrfdSession.run({

            [inputName]:
                tensor

        });


    const face =
        decodeSCRFD(
            outputs
        );


    if(!face)
        return null;


    face.x1 =
        (
            face.x1 -
            lb.ox
        ) / lb.scale;


    face.y1 =
        (
            face.y1 -
            lb.oy
        ) / lb.scale;


    face.x2 =
        (
            face.x2 -
            lb.ox
        ) / lb.scale;


    face.y2 =
        (
            face.y2 -
            lb.oy
        ) / lb.scale;


    face.x1 =
        Math.max(
            0,
            face.x1
        );


    face.y1 =
        Math.max(
            0,
            face.y1
        );


    face.x2 =
        Math.min(
            frame.width,
            face.x2
        );


    face.y2 =
        Math.min(
            frame.height,
            face.y2
        );


    return face;

}


/* =========================================================
   DRAW
========================================================= */

function drawFace(
    face
){

    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

    );


    if(!face)
        return;


    ctx.strokeStyle =
        livenessPassed
        ? '#00ff66'
        : '#ffd43b';


    ctx.lineWidth = 4;


    ctx.strokeRect(

        face.x1,
        face.y1,

        face.x2-face.x1,
        face.y2-face.y1

    );

}


/* =========================================================
   LIVENESS
========================================================= */

function checkLiveness(
    face,
    frameWidth
){

    if(!face){

        resetLiveness();


        challenge.textContent =
            '🔐 Đưa khuôn mặt vào giữa camera';


        return false;

    }


    const centerX =
        (
            face.x1 +
            face.x2
        ) / 2;


    const centerY =
        (
            face.y1 +
            face.y2
        ) / 2;


    if(
        previousX !== null
    ){

        const dx =
            Math.abs(
                centerX -
                previousX
            );


        const dy =
            Math.abs(
                centerY -
                previousY
            );


        if(

            dx >
            frameWidth * 0.008 ||

            dy >
            frameWidth * 0.006

        ){

            movementFrames++;

            movementTotal +=
                dx + dy;

        }

    }


    previousX = centerX;

    previousY = centerY;


    const required =
        frameWidth * 0.18;


    const progress =
        Math.min(

            100,

            Math.round(

                movementTotal /
                required *
                100

            )

        );


    if(

        movementFrames >= 6 &&

        movementTotal >= required

    ){

        livenessPassed = true;


        liveStatus.textContent =
            'ĐẠT';


        challenge.textContent =
            '✅ XÁC THỰC NGƯỜI THẬT THÀNH CÔNG';


        return true;

    }


    liveStatus.textContent =
        progress + '%';


    challenge.textContent =
        '🔐 XÁC THỰC NGƯỜI THẬT: ' +
        progress +
        '% — HÃY DI CHUYỂN ĐẦU NHẸ';


    return false;

}


/* =========================================================
   CROP FACE
========================================================= */

function cropFace(
    frame,
    face
){

    const width =
        face.x2 -
        face.x1;


    const height =
        face.y2 -
        face.y1;


    const paddingX =
        width * 0.25;


    const paddingY =
        height * 0.25;


    const x =
        Math.max(

            0,

            face.x1 -
            paddingX

        );


    const y =
        Math.max(

            0,

            face.y1 -
            paddingY

        );


    const x2 =
        Math.min(

            frame.width,

            face.x2 +
            paddingX

        );


    const y2 =
        Math.min(

            frame.height,

            face.y2 +
            paddingY

        );


    const c =
        document.createElement(
            'canvas'
        );


    c.width =
        FACE_SIZE;


    c.height =
        FACE_SIZE;


    c.getContext('2d')
     .drawImage(

        frame,

        x,
        y,

        x2-x,
        y2-y,

        0,
        0,

        FACE_SIZE,
        FACE_SIZE

     );


    return c;

}


/* =========================================================
   ARCFACE
========================================================= */

async function createEmbedding(
    faceCanvas
){

    const image =
        faceCanvas
        .getContext('2d')
        .getImageData(

            0,
            0,

            FACE_SIZE,
            FACE_SIZE

        );


    const area =
        FACE_SIZE *
        FACE_SIZE;


    const data =
        new Float32Array(
            area * 3
        );


    for(
        let i=0;
        i<area;
        i++
    ){

        const p =
            i * 4;


        data[i] =
            (
                image.data[p] -
                127.5
            ) / 127.5;


        data[area+i] =
            (
                image.data[p+1] -
                127.5
            ) / 127.5;


        data[area*2+i] =
            (
                image.data[p+2] -
                127.5
            ) / 127.5;

    }


    const tensor =
        new ort.Tensor(

            'float32',

            data,

            [
                1,
                3,
                FACE_SIZE,
                FACE_SIZE
            ]

        );


    const inputName =
        arcfaceSession.inputNames[0];


    const outputs =
        await arcfaceSession.run({

            [inputName]:
                tensor

        });


    const output =
        outputs[
            arcfaceSession
            .outputNames[0]
        ];


    const embedding =
        new Float32Array(
            output.data
        );


    let norm = 0;


    for(
        let i=0;
        i<embedding.length;
        i++
    ){

        norm +=
            embedding[i] *
            embedding[i];

    }


    norm =
        Math.sqrt(norm);


    if(!norm)
        return null;


    for(
        let i=0;
        i<embedding.length;
        i++
    ){

        embedding[i] /=
            norm;

    }


    return embedding;

}


/* =========================================================
   EMBEDDING → BASE64
========================================================= */

function embeddingToBase64(
    embedding
){

    const bytes =
        new Uint8Array(
            embedding.buffer
        );


    let binary = '';

    const chunk =
        0x8000;


    for(
        let i=0;
        i<bytes.length;
        i+=chunk
    ){

        binary +=
            String.fromCharCode.apply(

                null,

                bytes.subarray(

                    i,

                    Math.min(
                        i+chunk,
                        bytes.length
                    )

                )

            );

    }


    return btoa(
        binary
    );

}


/* =========================================================
   VALIDATE FORM
========================================================= */

function validateForm(){

    const hoTen =
        document.getElementById(
            'hoTen'
        ).value.trim();


    const ngheDanh =
        document.getElementById(
            'ngheDanh'
        ).value.trim();


    const nhom =
        document.getElementById(
            'nhom'
        ).value.trim();


    if(!hoTen){

        setStatus(
            '❌ Vui lòng nhập Họ và tên.',
            'red'
        );

        return false;

    }


    if(!ngheDanh){

        setStatus(
            '❌ Vui lòng nhập Nghệ danh / KIRA.',
            'red'
        );

        return false;

    }


    if(!nhom){

        setStatus(
            '❌ Vui lòng nhập Nhóm.',
            'red'
        );

        return false;

    }


    if(
        !currentEmbedding ||
        currentEmbedding.length !== 512
    ){

        setStatus(
            '❌ Chưa tạo Face ID 512D.',
            'red'
        );

        return false;

    }


    if(!livenessPassed){

        setStatus(
            '❌ Chưa xác thực người thật.',
            'red'
        );

        return false;

    }


    return true;

}


/* =========================================================
   SAVE FACE ID
========================================================= */

function saveEmployee(){

    if(
        !validateForm()
    )
        return;


    saveBtn.disabled = true;


    setStatus(
        '⏳ Đang lưu nhân sự...',
        'yellow'
    );


    const hoTen =
        document.getElementById(
            'hoTen'
        ).value.trim();


    const ngheDanh =
        document.getElementById(
            'ngheDanh'
        ).value.trim();


    const nhom =
        document.getElementById(
            'nhom'
        ).value.trim();


    const form =
        document.createElement(
            'form'
        );


    form.method =
        'POST';


    form.action =
        API_URL;


    form.target =
        'saveFrame';


    form.style.display =
        'none';


    const data = {

        action:'saveFace',

        hoTen:hoTen,

        ngheDanh:ngheDanh,

        nhom:nhom,

        faceId:
            embeddingToBase64(
                currentEmbedding
            )

    };


    Object.keys(data)
        .forEach(
            key => {

                const input =
                    document.createElement(
                        'input'
                    );


                input.type =
                    'hidden';


                input.name =
                    key;


                input.value =
                    data[key];


                form.appendChild(
                    input
                );

            }
        );


    document.body.appendChild(
        form
    );


    form.submit();


    setTimeout(

        function(){

            setStatus(
                '✅ ĐÃ GỬI LƯU NHÂN SỰ.',
                'green'
            );


            challenge.textContent =
                'Face ID đã được gửi lên hệ thống.';


            faceStatus.textContent =
                'ĐÃ LƯU';


            saveBtn.disabled =
                false;


            form.remove();

        },

        1500

    );

}


/* =========================================================
   RESET FORM
========================================================= */

function resetForm(){

    document.getElementById(
        'hoTen'
    ).value = '';


    document.getElementById(
        'ngheDanh'
    ).value = '';


    document.getElementById(
        'nhom'
    ).value = '';


    currentEmbedding = null;

    embeddingReady = false;

    saveBtn.disabled = true;


    faceStatus.textContent =
        'CHƯA TẠO';


    embeddingStatus.textContent =
        'CHƯA CÓ';


    resetLiveness();


    resultReset();


    setStatus(
        'Đã xóa thông tin nhập.',
        'yellow'
    );

}


function resultReset(){

    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

    );

}


/* =========================================================
   MAIN LOOP
========================================================= */

async function detectLoop(){

    if(!running)
        return;


    if(processing){

        requestAnimationFrame(
            detectLoop
        );

        return;

    }


    processing = true;


    try{

        const frame =
            getFrame();


        if(
            !frame.width ||
            !frame.height
        ){

            processing = false;


            setTimeout(
                detectLoop,
                200
            );


            return;

        }


        canvas.width =
            frame.width;


        canvas.height =
            frame.height;


        const face =
            await detectFace(
                frame
            );


        drawFace(face);


        if(!face){

            embeddingStatus.textContent =
                'CHƯA CÓ';


            currentEmbedding =
                null;


            saveBtn.disabled =
                true;


            resetLiveness();


            challenge.textContent =
                '🔐 Đưa khuôn mặt vào giữa camera';

        }
        else{

            const live =
                checkLiveness(
                    face,
                    frame.width
                );


            if(live){

                const faceCanvas =
                    cropFace(
                        frame,
                        face
                    );


                const embedding =
                    await createEmbedding(
                        faceCanvas
                    );


                if(

                    embedding &&

                    embedding.length === 512

                ){

                    currentEmbedding =
                        embedding;


                    embeddingReady =
                        true;


                    embeddingStatus.textContent =
                        '512D';


                    faceStatus.textContent =
                        'ĐÃ TẠO';


                    saveBtn.disabled =
                        false;


                    setStatus(
                        '✅ FACE ID 512D ĐÃ TẠO — CÓ THỂ LƯU.',
                        'green'
                    );

                }

            }

        }

    }
    catch(error){

        console.error(error);


        setStatus(
            '❌ Lỗi: ' +
            error.message,
            'red'
        );

    }


    processing = false;


    if(running){

        setTimeout(
            detectLoop,
            200
        );

    }

}
