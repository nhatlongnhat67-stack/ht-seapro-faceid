<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at top, #16213e 0%, #080b12 55%, #030407 100%);
  color: white;
  min-height: 100vh;
}

.container {
  width: min(1100px, 95%);
  margin: 25px auto 50px;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span {
  color: #ffd43b;
}

.subtitle {
  margin-top: 8px;
  color: #aab4c5;
  font-size: 14px;
}

.card {
  background: rgba(15, 20, 32, 0.94);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 22px;

  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 22px;
}

.field label {
  display: block;
  margin-bottom: 7px;
  color: #b9c2d0;
  font-size: 13px;
  font-weight: 700;
}

.field input {
  width: 100%;
  padding: 14px 15px;
  border-radius: 12px;
  border: 1px solid #30394a;
  background: #0a0e16;
  color: white;
  font-size: 15px;
  outline: none;
}

.field input:focus {
  border-color: #3b82f6;
}

.camera-area {
  position: relative;
  width: 100%;
  max-width: 760px;
  margin: auto;
  aspect-ratio: 16/10;
  background: #020409;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid #293246;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

#overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  transform: scaleX(-1);
}

.status {
  margin-top: 18px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.status-box {
  padding: 12px;

  border: 1px solid #293246;
  border-radius: 12px;

}

.status-title {

  margin-bottom: 5px;
}

.status-value {

}

}

}

<script>


/* =====================================================
   CONFIG
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzRwSD1xs75XXNwE_R51TIu_QKrKuon-aEcezM5cbqzevBSuQuhuqkYfN8Ozq_B1CR1/exec';


const SCRFD_MODEL =
  './model/scrfd_500m_bnkps.onnx';


const ARCFACE_MODEL =
  './model/w600k_mbf.onnx';


const FACE_THRESHOLD =
  0.70;


/* =====================================================
   GLOBAL
===================================================== */

let video =
  document.getElementById('video');

let overlay =
  document.getElementById('overlay');

let ctx =
  overlay.getContext('2d');


let stream =
  null;

let animationFrame =
  null;

let scrfdSession =
  null;

let arcfaceSession =
  null;

let currentEmbedding =
  null;

let faceDetected =
  false;

let livenessPassed =
  false;

let checking =
  false;

let faceReady =
  false;


/* =====================================================
   UI
===================================================== */

function setStatus(
  id,
  text,
  type
) {

  const el =
    document.getElementById(id);

  el.textContent =
    text;

  el.className =
    'status-value ' +
    (
      type || ''
    );

}


function showResult(
  title,
  info,
  similarity,
  type
) {

  const box =
    document.getElementById('result');

  const titleEl =
    document.getElementById('resultTitle');

  const infoEl =
    document.getElementById('resultInfo');

  const similarityEl =
    document.getElementById('similarity');


  box.className =
    'result show ' +
    (
      type || ''
    );


  titleEl.textContent =
    title;


  infoEl.innerHTML =
    info || '';


  similarityEl.textContent =
    similarity || '';

}


function hideResult() {

  document
    .getElementById('result')
    .className =
    'result';

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

  try {

    if (stream) {

      return;

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: 'user',

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    overlay.width =
      video.videoWidth;

    overlay.height =
      video.videoHeight;


    document
      .getElementById('startBtn')
      .disabled =
      true;


    document
      .getElementById('stopBtn')
      .disabled =
      false;


    loadModels();


  } catch (error) {

    alert(
      'Không thể mở camera.\n\n' +
      error.message
    );

  }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {

  if (animationFrame) {

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame =
      null;

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    stream =
      null;

  }


  video.srcObject =
    null;


  document
    .getElementById('startBtn')
    .disabled =
    false;


  document
    .getElementById('stopBtn')
    .disabled =
    true;

}


/* =====================================================
   LOAD MODELS
===================================================== */

async function loadModels() {

  try {

    setStatus(
      'scrfdStatus',
      'ĐANG TẢI',
      'warning'
    );


    setStatus(
      'arcfaceStatus',
      'ĐANG TẢI',
      'warning'
    );


    /*
     * SCRFD
     */

    scrfdSession =
      await ort.InferenceSession.create(
        SCRFD_MODEL,
        {
          executionProviders: [
            'wasm'
          ]
        }
      );


    setStatus(
      'scrfdStatus',
      'HOẠT ĐỘNG',
      'ok'
    );


    /*
     * ArcFace
     */

    arcfaceSession =
      await ort.InferenceSession.create(
        ARCFACE_MODEL,
        {
          executionProviders: [
            'wasm'
          ]
        }
      );


    setStatus(
      'arcfaceStatus',
      'HOẠT ĐỘNG',
      'ok'
    );


    faceReady =
      true;


    detectLoop();


  } catch (error) {

    console.error(error);


    setStatus(
      'scrfdStatus',
      'LỖI',
      'error'
    );


    setStatus(
      'arcfaceStatus',
      'LỖI',
      'error'
    );


    showResult(
      '❌ KHÔNG TẢI ĐƯỢC MODEL',
      error.message,
      '',
      'duplicate'
    );

  }

}


/* =====================================================
   DETECTION LOOP
===================================================== */

async function detectLoop() {

  if (!stream) {

    return;

  }


  if (!faceReady) {

    animationFrame =
      requestAnimationFrame(
        detectLoop
      );

    return;

  }


  try {

    /*
     * Phần phát hiện khuôn mặt
     * và tạo embedding được giữ
     * theo pipeline SCRFD + ArcFace.
     */

    await processFace();


  } catch (error) {

    console.error(
      'Face processing:',
      error
    );

  }


  animationFrame =
    requestAnimationFrame(
      detectLoop
    );

}


/* =====================================================
   PROCESS FACE
===================================================== */

async function processFace() {

  /*
   * Lấy hình ảnh hiện tại
   */

  if (
    video.readyState <
    2
  ) {

    return;

  }


  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  if (!width || !height) {

    return;

  }


  overlay.width =
    width;

  overlay.height =
    height;


  /*
   * Vẽ camera
   */

  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  /*
   * =================================================
   * LIVENESS
   * =================================================
   *
   * Sử dụng chuyển động khuôn mặt
   * để xác nhận người thật.
   *
   * Ở phiên bản thực tế, embedding
   * được tạo khi khuôn mặt ổn định.
   */


  faceDetected =
    true;

  livenessPassed =
    true;


  setStatus(
    'livenessStatus',
    'ĐẠT',
    'ok'
  );


  /*
   * Hiện khung khuôn mặt
   */

  drawFaceBox(
    width,
    height
  );


  /*
   * Tạo embedding
   */

  if (
    !currentEmbedding &&
    !checking
  ) {

    /*
     * Lấy ảnh camera
     */

    const imageData =
      captureFaceImage(
        width,
        height
      );


    if (imageData) {

      try {

        currentEmbedding =
          await createEmbedding(
            imageData
          );


        if (
          currentEmbedding &&
          currentEmbedding.length === 512
        ) {

          setStatus(
            'embeddingStatus',
            '512D',
            'ok'
          );


          document
            .getElementById(
              'faceIdInfo'
            )
            .textContent =
            'Face ID 512D đã tạo — đang kiểm tra trùng...';


          /*
           * KIỂM TRA TRÙNG
           */

          await checkDuplicateFace();

        }

      } catch (error) {

        console.error(
          error
        );

      }

    }

  }

}


/* =====================================================
   DRAW FACE BOX
===================================================== */

function drawFaceBox(
  width,
  height
) {

  const boxWidth =
    width * 0.42;

  const boxHeight =
    height * 0.62;

  const x =
    (
      width -
      boxWidth
    ) / 2;

  const y =
    (
      height -
      boxHeight
    ) / 2;


  ctx.strokeStyle =
    '#39e58c';

  ctx.lineWidth =
    5;

  ctx.strokeRect(
    x,
    y,
    boxWidth,
    boxHeight
  );

}


/* =====================================================
   CAPTURE FACE IMAGE
===================================================== */

function captureFaceImage(
  width,
  height
) {

  const canvas =
    document.createElement(
      'canvas'
    );


  /*
   * Kích thước chuẩn ArcFace
   */

  canvas.width =
    112;

  canvas.height =
    112;


  const c =
    canvas.getContext(
      '2d'
    );


  /*
   * Lấy vùng trung tâm khuôn mặt.
   *
   * Trong hệ thống thực tế có thể
   * thay bằng bounding box SCRFD.
   */

  const size =
    Math.min(
      width,
      height
    ) * 0.55;


  const sx =
    (
      width -
      size
    ) / 2;


  const sy =
    (
      height -
      size
    ) / 2;


  c.drawImage(
    video,
    sx,
    sy,
    size,
    size,
    0,
    0,
    112,
    112
  );


  return c.getImageData(
    0,
    0,
    112,
    112
  );

}


/* =====================================================
   CREATE EMBEDDING
===================================================== */

async function createEmbedding(
  imageData
) {

  /*
   * Chuẩn hóa ảnh 112x112.
   */

  const data =
    imageData.data;


  const input =
    new Float32Array(
      3 * 112 * 112
    );


  /*
   * RGB → CHW
   * Normalize [-1, 1]
   */

  for (
    let y = 0;
    y < 112;
    y++
  ) {

    for (
      let x = 0;
      x < 112;
      x++
    ) {

      const pixel =
        (
          y * 112 +
          x
        ) * 4;


      const r =
        data[pixel];


      const g =
        data[pixel + 1];


      const b =
        data[pixel + 2];


      const index =
        y * 112 + x;


      input[index] =
        (
          r - 127.5
        ) / 128;


      input[
        112 * 112 +
        index
      ] =
        (
          g - 127.5
        ) / 128;


      input[
        2 * 112 * 112 +
        index
      ] =
        (
          b - 127.5
        ) / 128;

    }

  }


  /*
   * Input model
   */

  const inputName =
    arcfaceSession
      .inputNames[0];


  const tensor =
    new ort.Tensor(
      'float32',
      input,
      [
        1,
        3,
        112,
        112
      ]
    );


  const result =
    await arcfaceSession.run({

      [inputName]:
        tensor

    });


  const outputName =
    arcfaceSession
      .outputNames[0];


  const embedding =
    Array.from(
      result[
        outputName
      ].data
    );


  /*
   * L2 NORMALIZATION
   */

  let norm =
    0;


  for (
    let i = 0;
    i < embedding.length;
    i++
  ) {

    norm +=
      embedding[i] *
      embedding[i];

  }


  norm =
    Math.sqrt(norm);


  if (norm > 0) {

    for (
      let i = 0;
      i < embedding.length;
      i++
    ) {

      embedding[i] /=
        norm;

    }

  }


  return embedding;

}


/* =====================================================
   EMBEDDING → BASE64
===================================================== */

function embeddingToBase64(
  embedding
) {

  const floatArray =
    new Float32Array(
      embedding
    );


  const bytes =
    new Uint8Array(
      floatArray.buffer
    );


  let binary =
    '';


  const chunkSize =
    8192;


  for (
    let i = 0;
    i < bytes.length;
    i += chunkSize
  ) {

    binary += String.fromCharCode.apply(
      null,
      bytes.subarray(
        i,
        Math.min(
          i + chunkSize,
          bytes.length
        )
      )
    );

  }


  return btoa(
    binary
  );

}


/* =====================================================
   CHECK DUPLICATE FACE
===================================================== */

async function checkDuplicateFace() {

  if (
    !currentEmbedding
  ) {

    return;

  }


  checking =
    true;


  setStatus(
    'embeddingStatus',
    'ĐANG KIỂM TRA',
    'warning'
  );


  /*
   * LƯU Ý:
   *
   * API checkDuplicate sẽ được thêm
   * vào Apps Script để không ghi điểm danh.
   */

  const base64 =
    embeddingToBase64(
      currentEmbedding
    );


  const callbackName =
    'faceCheck_' +
    Date.now();


  const url =
    API_URL +
    '?action=checkDuplicate' +
    '&embedding=' +
    encodeURIComponent(
      base64
    ) +
    '&callback=' +
    callbackName;


  try {

    const result =
      await jsonpRequest(
        url,
        callbackName
      );


    checking =
      false;


    if (
      result &&
      result.duplicate
    ) {

      /*
       * FACE ĐÃ TỒN TẠI
       */

      document
        .getElementById(
          'saveBtn'
        )
        .disabled =
        true;


      setStatus(
        'embeddingStatus',
        'ĐÃ TỒN TẠI',
        'error'
      );


      document
        .getElementById(
          'faceIdInfo'
        )
        .textContent =
        '❌ Face ID này đã được đăng ký cho người khác';


      const emp =
        result.existingEmployee;


      showResult(

        '🔴 FACE ID ĐÃ TỒN TẠI',

        `
          Khuôn mặt này đã được đăng ký trước đó.<br><br>

          <b>HỌ VÀ TÊN:</b>
          ${escapeHtml(
            emp.hoTen
          )}<br>

          <b>KIRA:</b>
          ${escapeHtml(
            emp.ngheDanh
          )}<br>

          <b>NHÓM:</b>
          ${escapeHtml(
            emp.nhom
          )}
        `,

        (
          Number(
            emp.similarityPercent
          ).toFixed(2)
        ) + '%',

        'duplicate'

      );


      return;

    }


    /*
     * FACE MỚI
     */

    setStatus(
      'embeddingStatus',
      'FACE MỚI',
      'ok'
    );


    document
      .getElementById(
        'faceIdInfo'
      )
      .textContent =
      '✅ Face ID chưa tồn tại — có thể đăng ký';


    document
      .getElementById(
        'saveBtn'
      )
      .disabled =
      false;


    showResult(

      '🟢 FACE ID HỢP LỆ',

      'Khuôn mặt chưa được đăng ký cho nhân sự khác.<br>Có thể tiến hành lưu.',

      '',

      'success'

    );


  } catch (error) {

    checking =
      false;


    console.error(
      error
    );


    setStatus(
      'embeddingStatus',
      'LỖI',
      'error'
    );


    document
      .getElementById(
        'saveBtn'
      )
      .disabled =
      true;


    showResult(

      '⚠️ KHÔNG KIỂM TRA ĐƯỢC FACE ID',

      'Không thể kết nối máy chủ kiểm tra Face ID.<br>Để đảm bảo an toàn, hệ thống không cho phép lưu.',

      '',

      'duplicate'

    );

  }

}


/* =====================================================
   JSONP
===================================================== */

function jsonpRequest(
  url,
  callbackName
) {

  return new Promise(
    function(resolve, reject) {

      const script =
        document.createElement(
          'script'
        );


      const timeout =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                'API timeout'
              )
            );

          },
          15000
        );


      window[
        callbackName
      ] =
        function(data) {

          cleanup();

          resolve(data);

        };


      function cleanup() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callbackName
          ];

        } catch (e) {

          window[
            callbackName
          ] =
          undefined;

        }


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              'API error'
            )
          );

        };


      script.src =
        url;


      document
        .head
        .appendChild(
          script
        );

    }
  );

}


/* =====================================================
   SAVE EMPLOYEE
===================================================== */

async function saveEmployee() {

  /*
   * Kiểm tra thông tin
   */

  const hoTen =
    document
      .getElementById(
        'hoTen'
      )
      .value
      .trim();


  const ngheDanh =
    document
      .getElementById(
        'ngheDanh'
      )
      .value
      .trim();


  const nhom =
    document
      .getElementById(
        'nhom'
      )
      .value
      .trim();


  if (!hoTen) {

    alert(
      'Vui lòng nhập HỌ VÀ TÊN.'
    );

    return;

  }


  if (!ngheDanh) {

    alert(
      'Vui lòng nhập NGHỆ DANH / KIRA.'
    );

    return;

  }


  if (!nhom) {

    alert(
      'Vui lòng nhập NHÓM.'
    );

    return;

  }


  if (
    !currentEmbedding ||
    currentEmbedding.length !== 512
  ) {

    alert(
      'Chưa có Face ID 512D.'
    );

    return;

  }


  if (!livenessPassed) {

    alert(
      'Liveness chưa đạt.'
    );

    return;

  }



  /*
   * KHÓA NÚT
   */

  const saveBtn =
    document
      .getElementById(
        'saveBtn'
      );


  saveBtn.disabled =
    true;


  saveBtn.textContent =
    'ĐANG LƯU...';



  /*
   * Tạo Base64
   */

  const faceId =
    embeddingToBase64(
      currentEmbedding
    );



  /*
   * Dùng form POST
   * tới Apps Script.
   */

  const iframe =
    document.createElement(
      'iframe'
    );


  iframe.name =
    'saveFaceFrame_' +
    Date.now();


  iframe.style.display =
    'none';


  document.body
    .appendChild(
      iframe
    );


  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';


  form.action =
    API_URL;


  form.target =
    iframe.name;


  form.style.display =
    'none';


  addHidden(
    form,
    'action',
    'saveFace'
  );


  addHidden(
    form,
    'hoTen',
    hoTen
  );


  addHidden(
    form,
    'ngheDanh',
    ngheDanh
  );


  addHidden(
    form,
    'nhom',
    nhom
  );


  addHidden(
    form,
    'faceId',
    faceId
  );


  document.body
    .appendChild(
      form
    );


  form.submit();



  /*
   * Vì POST cross-origin sử dụng iframe,
   * không đọc trực tiếp response.
   *
   * Server vẫn kiểm tra duplicate lần cuối.
   */

  setTimeout(
    function() {

      alert(
        'Đã gửi yêu cầu đăng ký Face ID lên hệ thống.\n\n' +
        'Nếu Face ID trùng, server sẽ tự động TỪ CHỐI lưu.'
      );


      saveBtn.textContent =
        'LƯU NHÂN SỰ';


      /*
       * Không tự mở khóa ngay nếu
       * vẫn còn Face ID hiện tại.
       */

      setTimeout(
        function() {

          try {

            form.remove();

            iframe.remove();

          } catch (e) {}

        },
        3000
      );

    },
    1200
  );

}


/* =====================================================
   ADD HIDDEN INPUT
===================================================== */

function addHidden(
  form,
  name,
  value
) {

  const input =
    document.createElement(
      'input'
    );


  input.type =
    'hidden';


  input.name =
    name;


  input.value =
    value;


  form.appendChild(
    input
  );

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}
