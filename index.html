<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HT SEAPRO - FACE ID</title>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.0/dist/ort.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0f17;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 25px 0 5px;
  color: #1683ff;
  font-size: 30px;
}

.subtitle {
  color: #bbb;
  font-size: 18px;
  margin-bottom: 25px;
}

.camera-wrap {
  width: min(90vw, 840px);
  margin: auto;
  position: relative;
}

video {
  width: 100%;
  display: block;
  border-radius: 20px;
  background: black;
  transform: scaleX(-1);
}

canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  transform: scaleX(-1);
}

.status {
  margin: 20px auto;
  font-size: 21px;
  color: #00ff66;
}

.result {
  width: min(90vw, 840px);
  margin: 15px auto;
  padding: 18px;
  border-radius: 15px;
  background: #111827;
  font-size: 18px;
  min-height: 60px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 15px 35px;
  background: #087cff;
  color: white;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #0065d8;
}

.small {
  color: #888;
  font-size: 13px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>HT SEAPRO</h1>
<div class="subtitle">
HỆ THỐNG ĐIỂM DANH NHẬN DIỆN KHUÔN MẶT
</div>

<div class="camera-wrap">
  <video id="video" autoplay playsinline></video>
  <canvas id="overlay"></canvas>
</div>

<div id="status" class="status">
Đang khởi động...
</div>

<div id="result" class="result">
Đang tải hệ thống AI...
</div>

<button id="startBtn" onclick="startCamera()">
📷 BẬT CAMERA
</button>

<div class="small">
SCRFD + ArcFace / InsightFace
</div>

<script>

const SCRFD_MODEL = "./model/scrfd_500m_bnkps.onnx";
const ARCFACE_MODEL = "./model/w600k_mbf.onnx";

const INPUT_SIZE = 640;

const DET_THRESHOLD = 0.50;
const NMS_THRESHOLD = 0.40;

const STRIDES = [8, 16, 32];

let scrfdSession = null;
let arcfaceSession = null;

let video = document.getElementById("video");
let canvas = document.getElementById("overlay");
let ctx = canvas.getContext("2d");

let running = false;
let processing = false;


// =====================================================
// KHỞI TẠO AI
// =====================================================

async function loadModels() {

  try {

    document.getElementById("status").innerText =
      "⏳ ĐANG TẢI SCRFD...";

    ort.env.wasm.numThreads = 1;

    scrfdSession = await ort.InferenceSession.create(
      SCRFD_MODEL,
      {
        executionProviders: ["wasm"]
      }
    );

    console.log("SCRFD INPUT:", scrfdSession.inputNames);
    console.log("SCRFD OUTPUT:", scrfdSession.outputNames);


    document.getElementById("status").innerText =
      "⏳ ĐANG TẢI ARCFACE...";


    arcfaceSession = await ort.InferenceSession.create(
      ARCFACE_MODEL,
      {
        executionProviders: ["wasm"]
      }
    );

    console.log(
      "ARCFACE INPUT:",
      arcfaceSession.inputNames
    );

    console.log(
      "ARCFACE OUTPUT:",
      arcfaceSession.outputNames
    );


    document.getElementById("status").innerText =
      "✅ AI ĐÃ SẴN SÀNG";

    document.getElementById("result").innerHTML =
      "SCRFD: <b>OK</b><br>" +
      "ArcFace: <b>OK</b>";

  } catch (error) {

    console.error(error);

    document.getElementById("status").innerText =
      "❌ LỖI TẢI AI";

    document.getElementById("result").innerText =
      error.message;
  }
}


// =====================================================
// CAMERA
// =====================================================

async function startCamera() {

  try {

    if (!scrfdSession || !arcfaceSession) {
      await loadModels();
    }

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },

        audio: false
      });

    video.srcObject = stream;

    await video.play();

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    running = true;

    document.getElementById("startBtn").style.display =
      "none";

    document.getElementById("status").innerText =
      "🔍 ĐANG QUÉT KHUÔN MẶT...";

    requestAnimationFrame(processFrame);

  } catch (error) {

    console.error(error);

    alert(
      "Không thể mở camera.\n\n" +
      error.message
    );
  }
}


// =====================================================
// LETTERBOX 640x640
// =====================================================

function makeInput(video) {

  const canvas2 = document.createElement("canvas");

  canvas2.width = INPUT_SIZE;
  canvas2.height = INPUT_SIZE;

  const c = canvas2.getContext("2d");

  c.fillStyle = "black";
  c.fillRect(
    0,
    0,
    INPUT_SIZE,
    INPUT_SIZE
  );

  const scale = Math.min(
    INPUT_SIZE / video.videoWidth,
    INPUT_SIZE / video.videoHeight
  );

  const w = video.videoWidth * scale;
  const h = video.videoHeight * scale;

  const dx = (INPUT_SIZE - w) / 2;
  const dy = (INPUT_SIZE - h) / 2;

  c.drawImage(
    video,
    dx,
    dy,
    w,
    h
  );

  return {
    canvas: canvas2,
    scale: scale,
    dx: dx,
    dy: dy
  };
}


// =====================================================
// CANVAS → TENSOR SCRFD
// =====================================================

function canvasToTensor(canvas2) {

  const c =
    canvas2.getContext("2d");

  const image =
    c.getImageData(
      0,
      0,
      INPUT_SIZE,
      INPUT_SIZE
    );

  const data =
    new Float32Array(
      3 * INPUT_SIZE * INPUT_SIZE
    );

  let p = 0;

  for (let y = 0; y < INPUT_SIZE; y++) {

    for (let x = 0; x < INPUT_SIZE; x++) {

      const i =
        (y * INPUT_SIZE + x) * 4;

      const r = image.data[i];
      const g = image.data[i + 1];
      const b = image.data[i + 2];

      data[p] =
        (r - 127.5) / 128;

      data[
        INPUT_SIZE * INPUT_SIZE + p
      ] =
        (g - 127.5) / 128;

      data[
        2 * INPUT_SIZE * INPUT_SIZE + p
      ] =
        (b - 127.5) / 128;

      p++;
    }
  }

  return new ort.Tensor(
    "float32",
    data,
    [1, 3, INPUT_SIZE, INPUT_SIZE]
  );
}


// =====================================================
// LẤY OUTPUT
// =====================================================

function getOutput(outputs, name) {

  if (outputs[name]) {
    return outputs[name];
  }

  const key =
    Object.keys(outputs)
      .find(
        x =>
          x.toLowerCase() ===
          name.toLowerCase()
      );

  return key
    ? outputs[key]
    : null;
}


// =====================================================
// SCRFD DECODE
// =====================================================

function decodeLayer(
  scoreTensor,
  bboxTensor,
  kpsTensor,
  stride
) {

  const scores = scoreTensor.data;
  const bbox = bboxTensor.data;
  const kps = kpsTensor.data;

  const H = scoreTensor.dims[2];
  const W = scoreTensor.dims[3];

  const results = [];

  const area = H * W;

  for (let y = 0; y < H; y++) {

    for (let x = 0; x < W; x++) {

      for (let a = 0; a < 2; a++) {

        const index =
          a * area +
          y * W +
          x;

        const score =
          scores[index];

        if (score < DET_THRESHOLD) {
          continue;
        }

        const cx =
          (x + 0.5) * stride;

        const cy =
          (y + 0.5) * stride;


        const base =
          a * 4 * area +
          y * W +
          x;


        const l =
          bbox[base] * stride;

        const t =
          bbox[base + area] * stride;

        const r =
          bbox[base + 2 * area] * stride;

        const b =
          bbox[base + 3 * area] * stride;


        const x1 = cx - l;
        const y1 = cy - t;
        const x2 = cx + r;
        const y2 = cy + b;


        const kpBase =
          a * 10 * area +
          y * W +
          x;

        const points = [];

        for (let k = 0; k < 5; k++) {

          const px =
            cx +
            kps[
              kpBase +
              (k * 2) * area
            ] * stride;

          const py =
            cy +
            kps[
              kpBase +
              (k * 2 + 1) * area
            ] * stride;

          points.push({
            x: px,
            y: py
          });
        }


        results.push({
          score,
          x1,
          y1,
          x2,
          y2,
          points
        });
      }
    }
  }

  return results;
}


// =====================================================
// IOU
// =====================================================

function iou(a, b) {

  const x1 =
    Math.max(a.x1, b.x1);

  const y1 =
    Math.max(a.y1, b.y1);

  const x2 =
    Math.min(a.x2, b.x2);

  const y2 =
    Math.min(a.y2, b.y2);

  const w =
    Math.max(0, x2 - x1);

  const h =
    Math.max(0, y2 - y1);

  const inter = w * h;

  const areaA =
    (a.x2 - a.x1) *
    (a.y2 - a.y1);

  const areaB =
    (b.x2 - b.x1) *
    (b.y2 - b.y1);

  return inter /
    (areaA + areaB - inter + 1e-6);
}


// =====================================================
// NMS
// =====================================================

function nms(boxes) {

  boxes.sort(
    (a, b) =>
      b.score - a.score
  );

  const result = [];

  while (boxes.length) {

    const best =
      boxes.shift();

    result.push(best);

    boxes =
      boxes.filter(
        b =>
          iou(best, b)
          < NMS_THRESHOLD
      );
  }

  return result;
}


// =====================================================
// SCRFD DETECTION
// =====================================================

async function detectFace() {

  const inputInfo =
    makeInput(video);

  const tensor =
    canvasToTensor(
      inputInfo.canvas
    );

  const inputName =
    scrfdSession.inputNames[0];

  const outputs =
    await scrfdSession.run({
      [inputName]: tensor
    });


  const all = [];

  for (const stride of STRIDES) {

    const score =
      getOutput(
        outputs,
        "score_" + stride
      );

    const bbox =
      getOutput(
        outputs,
        "bbox_" + stride
      );

    const kps =
      getOutput(
        outputs,
        "kps_" + stride
      );

    if (
      score &&
      bbox &&
      kps
    ) {

      all.push(
        ...decodeLayer(
          score,
          bbox,
          kps,
          stride
        )
      );
    }
  }

  return {
    faces: nms(all),
    inputInfo
  };
}


// =====================================================
// CROP + ALIGN KHUÔN MẶT
// =====================================================

function cropAlignedFace(
  face,
  inputInfo
) {

  const src =
    inputInfo.canvas;

  const p =
    face.points;

  if (!p || p.length < 5) {
    return null;
  }


  /*
    5 điểm chuẩn ArcFace 112x112

    mắt trái
    mắt phải
    mũi
    miệng trái
    miệng phải
  */

  const dst = [

    { x: 38.2946, y: 51.6963 },
    { x: 73.5318, y: 51.5014 },
    { x: 56.0252, y: 71.7366 },
    { x: 41.5493, y: 92.3655 },
    { x: 70.7299, y: 92.2041 }

  ];


  /*
    Dùng affine transform
    dựa trên mắt trái,
    mắt phải và mũi.
  */

  const s1 = p[0];
  const s2 = p[1];
  const s3 = p[2];

  const d1 = dst[0];
  const d2 = dst[1];
  const d3 = dst[2];


  const det =
    s1.x * (s2.y - s3.y) +
    s2.x * (s3.y - s1.y) +
    s3.x * (s1.y - s2.y);


  if (Math.abs(det) < 0.0001) {
    return null;
  }


  /*
    Tìm affine transform
    x' = a*x + b*y + c
    y' = d*x + e*y + f
  */


  function solve(values) {

    const A = [
      [s1.x, s1.y, 1],
      [s2.x, s2.y, 1],
      [s3.x, s3.y, 1]
    ];

    const B = values;

    for (let i = 0; i < 3; i++) {

      let max = i;

      for (let j = i + 1; j < 3; j++) {

        if (
          Math.abs(A[j][i]) >
          Math.abs(A[max][i])
        ) {
          max = j;
        }
      }

      [
        A[i],
        A[max]
      ] = [
        A[max],
        A[i]
      ];

      [
        B[i],
        B[max]
      ] = [
        B[max],
        B[i]
      ];


      for (
        let j = i + 1;
        j < 3;
        j++
      ) {

        const ratio =
          A[j][i] /
          A[i][i];

        for (
          let k = i;
          k < 3;
          k++
        ) {

          A[j][k] -=
            ratio *
            A[i][k];
        }

        B[j] -=
          ratio *
          B[i];
      }
    }


    const x =
      new Array(3);

    for (
      let i = 2;
      i >= 0;
      i--
    ) {

      x[i] =
        (
          B[i] -
          A[i][i + 1] *
          (x[i + 1] || 0) -
          A[i][i + 2] *
          (x[i + 2] || 0)
        ) /
        A[i][i];
    }

    return x;
  }


  const X =
    solve([
      d1.x,
      d2.x,
      d3.x
    ]);

  const Y =
    solve([
      d1.y,
      d2.y,
      d3.y
    ]);


  const out =
    document.createElement(
      "canvas"
    );

  out.width = 112;
  out.height = 112;

  const c =
    out.getContext("2d");

  c.fillStyle = "black";

  c.fillRect(
    0,
    0,
    112,
    112
  );


  /*
    Canvas transform:
    source → destination
  */

  c.setTransform(
    X[0],
    Y[0],
    X[1],
    Y[1],
    X[2],
    Y[2]
  );

  c.drawImage(
    src,
    0,
    0
  );

  c.setTransform(
    1,
    0,
    0,
    1,
    0,
    0
  );


  return out;
}


// =====================================================
// ẢNH 112x112 → ARCFACE TENSOR
// =====================================================

function faceCanvasToTensor(faceCanvas) {

  const c =
    faceCanvas.getContext("2d");

  const image =
    c.getImageData(
      0,
      0,
      112,
      112
    );

  const size =
    112 * 112;

  const data =
    new Float32Array(
      size * 3
    );

  let p = 0;

  for (
    let y = 0;
    y < 112;
    y++
  ) {

    for (
      let x = 0;
      x < 112;
      x++
    ) {

      const i =
        (y * 112 + x) * 4;

      const r =
        image.data[i];

      const g =
        image.data[i + 1];

      const b =
        image.data[i + 2];


      /*
        ArcFace:
        (RGB - 127.5) / 127.5
      */

      data[p] =
        (r - 127.5) /
        127.5;

      data[
        size + p
      ] =
        (g - 127.5) /
        127.5;

      data[
        size * 2 + p
      ] =
        (b - 127.5) /
        127.5;

      p++;
    }
  }


  return new ort.Tensor(
    "float32",
    data,
    [1, 3, 112, 112]
  );
}


// =====================================================
// ARCFACE EMBEDDING
// =====================================================

async function createFaceEmbedding(
  faceCanvas
) {

  const tensor =
    faceCanvasToTensor(
      faceCanvas
    );

  const inputName =
    arcfaceSession.inputNames[0];

  const outputs =
    await arcfaceSession.run({
      [inputName]: tensor
    });


  const outputName =
    arcfaceSession.outputNames[0];

  const embedding =
    outputs[outputName].data;


  /*
    L2 NORMALIZATION
  */

  let sum = 0;

  for (
    let i = 0;
    i < embedding.length;
    i++
  ) {

    sum +=
      embedding[i] *
      embedding[i];
  }


  const norm =
    Math.sqrt(sum);


  const normalized =
    new Float32Array(
      embedding.length
    );


  for (
    let i = 0;
    i < embedding.length;
    i++
  ) {

    normalized[i] =
      embedding[i] /
      (norm || 1);
  }


  return normalized;
}


// =====================================================
// VẼ KHUÔN MẶT
// =====================================================

function drawFace(
  face,
  inputInfo
) {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const scale =
    1 / inputInfo.scale;


  const x1 =
    (face.x1 -
      inputInfo.dx) *
    scale;

  const y1 =
    (face.y1 -
      inputInfo.dy) *
    scale;

  const x2 =
    (face.x2 -
      inputInfo.dx) *
    scale;

  const y2 =
    (face.y2 -
      inputInfo.dy) *
    scale;


  ctx.strokeStyle =
    "#00ff55";

  ctx.lineWidth = 4;

  ctx.strokeRect(
    x1,
    y1,
    x2 - x1,
    y2 - y1
  );


  ctx.fillStyle =
    "#00ff55";


  for (
    const point of face.points
  ) {

    const px =
      (point.x -
        inputInfo.dx) *
      scale;

    const py =
      (point.y -
        inputInfo.dy) *
      scale;


    ctx.beginPath();

    ctx.arc(
      px,
      py,
      5,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }
}


// =====================================================
// XỬ LÝ CAMERA
// =====================================================

async function processFrame() {

  if (!running) {
    return;
  }


  if (
    !processing &&
    video.readyState >= 2
  ) {

    processing = true;


    try {

      const result =
        await detectFace();


      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      if (
        result.faces.length === 0
      ) {

        document.getElementById(
          "status"
        ).innerText =
          "🔍 ĐANG TÌM KHUÔN MẶT...";

      } else {

        const face =
          result.faces[0];


        drawFace(
          face,
          result.inputInfo
        );


        document.getElementById(
          "status"
        ).innerText =
          "✅ ĐÃ PHÁT HIỆN " +
          result.faces.length +
          " KHUÔN MẶT";


        /*
          Tạo ảnh khuôn mặt
          đã căn chỉnh
        */

        const aligned =
          cropAlignedFace(
            face,
            result.inputInfo
          );


        if (aligned) {

          try {

            const embedding =
              await createFaceEmbedding(
                aligned
              );


            document.getElementById(
              "result"
            ).innerHTML =

              "🟢 <b>ARCFACE HOẠT ĐỘNG</b><br>" +

              "Face ID: <b>ĐÃ TẠO</b><br>" +

              "Embedding: <b>" +
              embedding.length +
              " chiều</b>";

            console.log(
              "FACE EMBEDDING:",
              embedding
            );

          } catch (error) {

            console.error(
              "ArcFace error:",
              error
            );

            document.getElementById(
              "result"
            ).innerText =
              "❌ ArcFace lỗi: " +
              error.message;
          }

        }

      }

    } catch (error) {

      console.error(
        "Detection error:",
        error
      );

      document.getElementById(
        "status"
      ).innerText =
        "❌ LỖI AI";

      document.getElementById(
        "result"
      ).innerText =
        error.message;
    }


    processing = false;
  }


  requestAnimationFrame(
    processFrame
  );
}


// =====================================================
// TỰ ĐỘNG TẢI MODEL
// =====================================================

loadModels();

</script>

</body>
</html>
