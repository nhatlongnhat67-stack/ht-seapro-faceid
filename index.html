<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbzRwSD1xs75XXNwE_R51TIu_QKrKuon-aEcezM5cbqzevBSuQuhuqkYfN8Ozq_B1CR1/exec';

const SCRFD_MODEL =
'./model/scrfd_500m_bnkps.onnx';

const ARCFACE_MODEL =
'./model/w600k_mbf.onnx';

const INPUT_SIZE = 640;

const FACE_SIZE = 112;

const DET_THRESHOLD = 0.50;

const FACE_THRESHOLD = 0.80;

const STRIDES = [8,16,32];


/* =====================================================
   DOM
===================================================== */

const video =
document.getElementById('video');

const canvas =
document.getElementById('canvas');

const ctx =
canvas.getContext('2d');

const statusBox =
document.getElementById('status');

const challengeBox =
document.getElementById('challenge');

const resultBox =
document.getElementById('result');


/* =====================================================
   STATE
===================================================== */

let cameraStream = null;

let scrfdSession = null;

let arcfaceSession = null;

let running = false;

let processing = false;

let latestFace = null;

let latestEmbedding = null;


/*
   Liveness state
*/

let livenessStarted = false;

let livenessPassed = false;

let movementFrames = 0;

let previousCenterX = null;

let previousCenterY = null;

let movementTotal = 0;


/*
   Không gửi API liên tục
*/

let identifying = false;

let lastIdentifyTime = 0;


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    text,
    type='yellow'
){

    statusBox.className =
        'status ' + type;

    statusBox.textContent =
        text;

}


/* =====================================================
   LOAD MODEL
===================================================== */

async function loadModels(){

    try{

        setStatus(
            'Đang tải SCRFD...',
            'yellow'
        );

        scrfdSession =
            await ort.InferenceSession.create(
                SCRFD_MODEL,
                {
                    executionProviders:['wasm']
                }
            );

        document.getElementById(
            'scrfdStatus'
        ).textContent =
            'HOẠT ĐỘNG';


        setStatus(
            'Đang tải ArcFace...',
            'yellow'
        );


        arcfaceSession =
            await ort.InferenceSession.create(
                ARCFACE_MODEL,
                {
                    executionProviders:['wasm']
                }
            );


        document.getElementById(
            'arcStatus'
        ).textContent =
            'HOẠT ĐỘNG';


        challengeBox.textContent =
            'Nhấn BẮT ĐẦU ĐIỂM DANH';


        setStatus(
            'Hệ thống sẵn sàng.',
            'green'
        );


    }catch(error){

        console.error(error);

        setStatus(
            'LỖI TẢI MODEL: ' +
            error.message,
            'red'
        );

    }

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    if(
        running
    ){
        return;
    }


    try{

        if(
            !scrfdSession ||
            !arcfaceSession
        ){

            setStatus(
                'Model chưa tải xong.',
                'red'
            );

            return;

        }


        cameraStream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    facingMode:'user'

                },

                audio:false

            });


        video.srcObject =
            cameraStream;


        await video.play();


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        running = true;

        livenessStarted = true;

        livenessPassed = false;

        movementFrames = 0;

        previousCenterX = null;

        previousCenterY = null;

        movementTotal = 0;

        latestEmbedding = null;

        resultBox.classList.remove(
            'show'
        );


        challengeBox.textContent =
            '🔐 HÃY DI CHUYỂN ĐẦU NHẸ SANG TRÁI RỒI SANG PHẢI';


        setStatus(
            'Đang kiểm tra người thật...',
            'yellow'
        );


        detectLoop();


    }catch(error){

        console.error(error);

        setStatus(
            'Không mở được camera: ' +
            error.message,
            'red'
        );

    }

}


/* =====================================================
   STOP
===================================================== */

function stopCamera(){

    running = false;

    processing = false;

    identifying = false;


    if(cameraStream){

        cameraStream
        .getTracks()
        .forEach(
            track => track.stop()
        );

        cameraStream = null;

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    challengeBox.textContent =
        'Nhấn BẮT ĐẦU ĐIỂM DANH';


    setStatus(
        'Camera đã dừng.',
        'yellow'
    );

}


/* =====================================================
   LETTERBOX
===================================================== */

function makeLetterbox(
    source,
    size
){

    const scale =
        Math.min(
            size / source.width,
            size / source.height
        );


    const nw =
        Math.round(
            source.width * scale
        );


    const nh =
        Math.round(
            source.height * scale
        );


    const c =
        document.createElement(
            'canvas'
        );


    c.width = size;

    c.height = size;


    const g =
        c.getContext('2d');


    g.fillStyle =
        'rgb(127,127,127)';

    g.fillRect(
        0,
        0,
        size,
        size
    );


    const dx =
        (size - nw) / 2;

    const dy =
        (size - nh) / 2;


    g.drawImage(
        source,
        dx,
        dy,
        nw,
        nh
    );


    return {

        canvas:c,

        scale:scale,

        offsetX:dx,

        offsetY:dy

    };

}


/* =====================================================
   CANVAS → TENSOR
===================================================== */

function canvasToTensor(
    source
){

    const image =
        source
        .getContext('2d')
        .getImageData(
            0,
            0,
            source.width,
            source.height
        );


    const area =
        source.width *
        source.height;


    const data =
        new Float32Array(
            area * 3
        );


    for(
        let y=0;
        y<source.height;
        y++
    ){

        for(
            let x=0;
            x<source.width;
            x++
        ){

            const p =
                (
                    y *
                    source.width +
                    x
                ) * 4;


            const i =
                y *
                source.width +
                x;


            data[i] =
                (
                    image.data[p] -
                    127.5
                ) / 128;


            data[area+i] =
                (
                    image.data[p+1] -
                    127.5
                ) / 128;


            data[area*2+i] =
                (
                    image.data[p+2] -
                    127.5
                ) / 128;

        }

    }


    return new ort.Tensor(

        'float32',

        data,

        [
            1,
            3,
            source.height,
            source.width
        ]

    );

}


/* =====================================================
   FIND OUTPUT
===================================================== */

function findOutput(
    outputs,
    name
){

    const key =
        Object.keys(outputs)
        .find(
            k =>
            k.toLowerCase()
            .includes(
                name.toLowerCase()
            )
        );


    return key
        ? outputs[key]
        : null;

}


/* =====================================================
   SCRFD DETECT
===================================================== */

async function detectFace(
    frame
){

    const lb =
        makeLetterbox(
            frame,
            INPUT_SIZE
        );


    const tensor =
        canvasToTensor(
            lb.canvas
        );


    const inputName =
        scrfdSession
        .inputNames[0];


    const outputs =
        await scrfdSession.run({

            [inputName]:
                tensor

        });


    const detections = [];


    for(
        let si=0;
        si<STRIDES.length;
        si++
    ){

        const stride =
            STRIDES[si];


        const score =
            findOutput(
                outputs,
                'score_' + stride
            );


        const bbox =
            findOutput(
                outputs,
                'bbox_' + stride
            );


        if(
            !score ||
            !bbox
        ){

            continue;

        }


        const scores =
            score.data;

        const boxes =
            bbox.data;


        const dims =
            score.dims;


        let count = 0;


        if(
            dims.length === 3
        ){

            count =
                dims[1];

        }else if(
            dims.length === 4
        ){

            count =
                dims[2] *
                dims[3];

        }


        const gridW =
            Math.ceil(
                INPUT_SIZE /
                stride
            );


        for(
            let i=0;
            i<count;
            i++
        ){

            const s =
                scores[i];


            if(
                s <
                DET_THRESHOLD
            ){

                continue;

            }


            const cell =
                Math.floor(
                    i / 2
                );


            const gx =
                cell %
                gridW;


            const gy =
                Math.floor(
                    cell /
                    gridW
                );


            const base =
                i * 4;


            if(
                base + 3 >=
                boxes.length
            ){

                continue;

            }


            const x1 =
                gx * stride -
                boxes[base] *
                stride;


            const y1 =
                gy * stride -
                boxes[base+1] *
                stride;


            const x2 =
                gx * stride +
                boxes[base+2] *
                stride;


            const y2 =
                gy * stride +
                boxes[base+3] *
                stride;


            detections.push({

                score:s,

                x1:x1,

                y1:y1,

                x2:x2,

                y2:y2

            });

        }

    }


    if(
        !detections.length
    ){

        return null;

    }


    detections.sort(
        (a,b) =>
        b.score -
        a.score
    );


    const best =
        detections[0];


    best.x1 =
        (
            best.x1 -
            lb.offsetX
        ) /
        lb.scale;


    best.y1 =
        (
            best.y1 -
            lb.offsetY
        ) /
        lb.scale;


    best.x2 =
        (
            best.x2 -
            lb.offsetX
        ) /
        lb.scale;


    best.y2 =
        (
            best.y2 -
            lb.offsetY
        ) /
        lb.scale;


    best.x1 =
        Math.max(
            0,
            best.x1
        );


    best.y1 =
        Math.max(
            0,
            best.y1
        );


    best.x2 =
        Math.min(
            frame.width,
            best.x2
        );


    best.y2 =
        Math.min(
            frame.height,
            best.y2
        );


    return best;

}


/* =====================================================
   LIVENESS
===================================================== */

function updateLiveness(
    face,
    frameWidth
){

    if(
        !face
    ){

        previousCenterX =
            null;

        previousCenterY =
            null;

        movementFrames = 0;

        movementTotal = 0;

        livenessPassed = false;

        challengeBox.textContent =
            '🔐 Đưa khuôn mặt vào giữa camera';

        return false;

    }


    const centerX =
        (
            face.x1 +
            face.x2
        ) / 2;


    const centerY =
        (
            face.y1 +
            face.y2
        ) / 2;


    if(
        previousCenterX !== null
    ){

        const dx =
            Math.abs(
                centerX -
                previousCenterX
            );


        const dy =
            Math.abs(
                centerY -
                previousCenterY
            );


        /*
          Chuyển động phải đủ rõ.
        */

        if(
            dx >
            frameWidth * 0.012 ||
            dy >
            frameWidth * 0.008
        ){

            movementFrames++;

            movementTotal +=
                dx + dy;

        }

    }


    previousCenterX =
        centerX;


    previousCenterY =
        centerY;


    /*
      Cần nhiều frame chuyển động
      và tổng chuyển động đủ lớn.
    */

    if(
        movementFrames >= 6 &&
        movementTotal >
        frameWidth * 0.18
    ){

        livenessPassed =
            true;


        challengeBox.textContent =
            '✅ XÁC THỰC NGƯỜI THẬT THÀNH CÔNG';


        return true;

    }


    const progress =
        Math.min(
            100,
            Math.round(
                movementTotal /
                (
                    frameWidth *
                    0.18
                ) *
                100
            )
        );


    challengeBox.textContent =
        '🔐 XÁC THỰC NGƯỜI THẬT: ' +
        progress +
        '% • HÃY DI CHUYỂN ĐẦU NHẸ';


    return false;

}


/* =====================================================
   CROP FACE
===================================================== */

function cropFace(
    frame,
    face
){

    const w =
        face.x2 -
        face.x1;


    const h =
        face.y2 -
        face.y1;


    const padX =
        w * 0.25;


    const padY =
        h * 0.25;


    const x =
        Math.max(
            0,
            face.x1 -
            padX
        );


    const y =
        Math.max(
            0,
            face.y1 -
            padY
        );


    const x2 =
        Math.min(
            frame.width,
            face.x2 +
            padX
        );


    const y2 =
        Math.min(
            frame.height,
            face.y2 +
            padY
        );


    const c =
        document.createElement(
            'canvas'
        );


    c.width =
        FACE_SIZE;

    c.height =
        FACE_SIZE;


    c.getContext('2d')
    .drawImage(

        frame,

        x,
        y,
        x2-x,
        y2-y,

        0,
        0,
        FACE_SIZE,
        FACE_SIZE

    );


    return c;

}


/* =====================================================
   ARCFACE
===================================================== */

async function createEmbedding(
    faceCanvas
){

    const image =
        faceCanvas
        .getContext('2d')
        .getImageData(
            0,
            0,
            FACE_SIZE,
            FACE_SIZE
        );


    const area =
        FACE_SIZE *
        FACE_SIZE;


    const data =
        new Float32Array(
            area * 3
        );


    for(
        let y=0;
        y<FACE_SIZE;
        y++
    ){

        for(
            let x=0;
            x<FACE_SIZE;
            x++
        ){

            const p =
                (
                    y *
                    FACE_SIZE +
                    x
                ) * 4;


            const i =
                y *
                FACE_SIZE +
                x;


            data[i] =
                (
                    image.data[p] -
                    127.5
                ) / 127.5;


            data[area+i] =
                (
                    image.data[p+1] -
                    127.5
                ) / 127.5;


            data[area*2+i] =
                (
                    image.data[p+2] -
                    127.5
                ) / 127.5;

        }

    }


    const tensor =
        new ort.Tensor(

            'float32',

            data,

            [
                1,
                3,
                FACE_SIZE,
                FACE_SIZE
            ]

        );


    const inputName =
        arcfaceSession
        .inputNames[0];


    const outputs =
        await arcfaceSession.run({

            [inputName]:
                tensor

        });


    const output =
        outputs[
            arcfaceSession
            .outputNames[0]
        ];


    const embedding =
        new Float32Array(
            output.data
        );


    let norm = 0;


    for(
        let i=0;
        i<embedding.length;
        i++
    ){

        norm +=
            embedding[i] *
            embedding[i];

    }


    norm =
        Math.sqrt(norm);


    if(
        norm === 0
    ){

        return null;

    }


    for(
        let i=0;
        i<embedding.length;
        i++
    ){

        embedding[i] /=
            norm;

    }


    return embedding;

}


/* =====================================================
   FLOAT32 → BASE64
===================================================== */

function float32ToBase64(
    array
){

    const bytes =
        new Uint8Array(
            array.buffer
        );


    let binary = '';

    const chunk =
        0x8000;


    for(
        let i=0;
        i<bytes.length;
        i+=chunk
    ){

        binary +=
            String.fromCharCode
            .apply(
                null,
                bytes.subarray(
                    i,
                    Math.min(
                        i+chunk,
                        bytes.length
                    )
                )
            );

    }


    return btoa(
        binary
    );

}


/* =====================================================
   DRAW FACE
===================================================== */

function drawFace(
    face
){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if(
        !face
    ){

        return;

    }


    ctx.strokeStyle =
        livenessPassed
        ? '#00ff66'
        : '#ffd43b';


    ctx.lineWidth =
        4;


    ctx.strokeRect(

        face.x1,
        face.y1,

        face.x2-face.x1,
        face.y2-face.y1

    );

}


/* =====================================================
   GỬI NHẬN DIỆN
===================================================== */

function identifyFace(
    embedding
){

    if(
        identifying
    ){

        return;

    }


    const now =
        Date.now();


    if(
        now -
        lastIdentifyTime <
        3000
    ){

        return;

    }


    identifying = true;

    lastIdentifyTime =
        now;


    const base64 =
        float32ToBase64(
            embedding
        );


    const callbackName =
        'faceCallback_' +
        Date.now();


    window[
        callbackName
    ] =
        function(data){

            try{

                if(
                    data &&
                    data.matched &&
                    Number(data.score) >=
                    FACE_THRESHOLD
                ){

                    showSuccess(
                        data
                    );

                }else{

                    resultBox.classList.remove(
                        'show'
                    );


                    const score =
                        Number(
                            data?.score || 0
                        );


                    setStatus(

                        '❌ KHÔNG ĐỦ ĐỘ NHẬN DIỆN: ' +
                        (score * 100).toFixed(2) +
                        '% — CẦN ≥ 80%',

                        'red'

                    );

                }

            }catch(error){

                console.error(
                    error
                );

            }


            identifying =
                false;


            try{

                delete window[
                    callbackName
                ];

            }catch(e){}

        };


    const script =
        document.createElement(
            'script'
        );


    script.src =
        API_URL +
        '?action=identify' +
        '&embedding=' +
        encodeURIComponent(
            base64
        ) +
        '&callback=' +
        callbackName;


    script.onerror =
        function(){

            identifying =
                false;

            setStatus(
                'Không kết nối được máy chủ.',
                'red'
            );

        };


    document.body.appendChild(
        script
    );


    setTimeout(
        function(){

            try{

                script.remove();

            }catch(e){}

        },
        10000
    );

}


/* =====================================================
   THÀNH CÔNG
===================================================== */

function showSuccess(
    data
){

    const score =
        Number(
            data.score || 0
        );


    resultBox.classList.add(
        'show'
    );


    document.getElementById(
        'resultNick'
    ).textContent =
        data.ngheDanh || '';


    document.getElementById(
        'resultName'
    ).textContent =
        data.hoTen || '';


    document.getElementById(
        'resultGroup'
    ).textContent =
        'Nhóm: ' +
        (data.nhom || '');


    document.getElementById(
        'resultScore'
    ).textContent =
        'Độ tương đồng: ' +
        (score * 100).toFixed(2) +
        '%';


    if(
        data.attendanceRecorded
    ){

        setStatus(
            '✅ ĐIỂM DANH THÀNH CÔNG',
            'green'
        );

    }else{

        setStatus(
            data.attendanceMessage ||
            'Đã nhận diện',
            'green'
        );

    }

}


/* =====================================================
   MAIN LOOP
===================================================== */

async function detectLoop(){

    if(
        !running
    ){

        return;

    }


    if(
        processing
    ){

        requestAnimationFrame(
            detectLoop
        );

        return;

    }


    processing = true;


    try{

        const frame =
            document.createElement(
                'canvas'
            );


        frame.width =
            video.videoWidth;

        frame.height =
            video.videoHeight;


        frame
        .getContext('2d')
        .drawImage(

            video,

            0,
            0,

            frame.width,
            frame.height

        );


        const face =
            await detectFace(
                frame
            );


        latestFace =
            face;


        drawFace(
            face
        );


        if(
            !face
        ){

            latestEmbedding =
                null;

            document.getElementById(
                'embeddingStatus'
            ).textContent =
                'CHƯA CÓ';


            setStatus(
                'Đưa khuôn mặt vào camera...',
                'yellow'
            );


            livenessPassed =
                false;


        }else{

            /*
              Bước 1:
              Liveness
            */

            const live =
                updateLiveness(
                    face,
                    frame.width
                );


            if(
                !live
            ){

                document.getElementById(
                    'embeddingStatus'
                ).textContent =
                    'CHỜ LIVENESS';


            }else{

                /*
                  Bước 2:
                  ArcFace
                */

                const faceCanvas =
                    cropFace(
                        frame,
                        face
                    );


                const embedding =
                    await createEmbedding(
                        faceCanvas
                    );


                if(
                    embedding &&
                    embedding.length === 512
                ){

                    latestEmbedding =
                        embedding;


                    document.getElementById(
                        'embeddingStatus'
                    ).textContent =
                        '512D ĐÃ TẠO';


                    setStatus(
                        '🔐 Người thật đã xác nhận • Đang nhận diện...',
                        'yellow'
                    );


                    /*
                      Chỉ gửi khi
                      đã qua liveness
                    */

                    identifyFace(
                        embedding
                    );

                }

            }

        }


    }catch(error){

        console.error(error);

        setStatus(
            'Lỗi xử lý: ' +
            error.message,
            'red'
        );

    }


    processing = false;


    if(
        running
    ){

        setTimeout(
            detectLoop,
            250
        );

    }

}
