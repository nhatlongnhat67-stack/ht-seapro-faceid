/* =====================================================
   CẤU HÌNH
===================================================== */

const SCRFD_MODEL =
    "./model/scrfd_500m_bnkps.onnx";

const ARCFACE_MODEL =
    "./model/w600k_mbf.onnx";

const INPUT_SIZE = 640;

const FACE_SIZE = 112;

const DET_THRESHOLD = 0.50;

const NMS_THRESHOLD = 0.40;

const STRIDES = [8, 16, 32];

const NUM_ANCHORS = 2;


/* =====================================================
   BIẾN
===================================================== */

let scrfdSession = null;

let arcfaceSession = null;

let video =
    document.getElementById("video");

let canvas =
    document.getElementById("overlay");

let ctx =
    canvas.getContext("2d");

let running = false;

let processing = false;

let lastEmbedding = null;


/* =====================================================

===================================================== */

/* =====================================================
   LETTERBOX
===================================================== */

function makeInput(sourceVideo) {

    const c =
        document.createElement(
            "canvas"
        );

    c.width =
        INPUT_SIZE;

    c.height =
        INPUT_SIZE;


    const g =
        c.getContext("2d");


    g.fillStyle = "black";

    g.fillRect(
        0,
        0,
        INPUT_SIZE,
        INPUT_SIZE
    );


    const scale =
        Math.min(

            INPUT_SIZE /
            sourceVideo.videoWidth,

            INPUT_SIZE /
            sourceVideo.videoHeight

        );


    const width =
        sourceVideo.videoWidth *
        scale;

    const height =
        sourceVideo.videoHeight *
        scale;


    const dx =
        (INPUT_SIZE - width) / 2;

    const dy =
        (INPUT_SIZE - height) / 2;


    g.drawImage(

        sourceVideo,

        dx,
        dy,

        width,
        height

    );


    return {

        canvas: c,

        scale: scale,

        dx: dx,

        dy: dy,

        width: width,

        height: height

    };

}


/* =====================================================
   CANVAS → SCRFD TENSOR
===================================================== */

function canvasToTensor(c) {

    const g =
        c.getContext("2d");


    const image =
        g.getImageData(

            0,
            0,
            INPUT_SIZE,
            INPUT_SIZE

        );


    const area =
        INPUT_SIZE *
        INPUT_SIZE;


    const data =
        new Float32Array(
            area * 3
        );


    let p = 0;


    for (
        let y = 0;
        y < INPUT_SIZE;
        y++
    ) {

        for (
            let x = 0;
            x < INPUT_SIZE;
            x++
        ) {

            const i =
                (y * INPUT_SIZE + x) * 4;


            const r =
                image.data[i];

            const g =
                image.data[i + 1];

            const b =
                image.data[i + 2];


            data[p] =
                (r - 127.5) / 128.0;


            data[
                area + p
            ] =
                (g - 127.5) / 128.0;


            data[
                area * 2 + p
            ] =
                (b - 127.5) / 128.0;


            p++;

        }

    }


    return new ort.Tensor(

        "float32",

        data,

        [
            1,
            3,
            INPUT_SIZE,
            INPUT_SIZE
        ]

    );

}


/* =====================================================
   OUTPUT
===================================================== */

function getOutput(
    outputs,
    name
) {

    if (outputs[name]) {
        return outputs[name];
    }


    const key =
        Object.keys(outputs)
        .find(

            k =>
                k.toLowerCase() ===
                name.toLowerCase()

        );


    if (key) {
        return outputs[key];
    }


    return null;

}


/* =====================================================
   TENSOR → ARRAY
===================================================== */

function tensorData(tensor) {

    return tensor.data;

}


/* =====================================================
   SCRFD DECODE
   HỖ TRỢ CẢ:

   [1,N,C]

   VÀ

   [1,C,H,W]
===================================================== */

function decodeSCRFDLayer(

    scoreTensor,

    bboxTensor,

    kpsTensor,

    stride

) {

    const scores =
        tensorData(scoreTensor);

    const bbox =
        tensorData(bboxTensor);

    const kps =
        tensorData(kpsTensor);


    const sd =
        scoreTensor.dims;

    const bd =
        bboxTensor.dims;

    const kd =
        kpsTensor.dims;


    console.log(
        "SCRFD LAYER",
        stride,
        "score",
        sd,
        "bbox",
        bd,
        "kps",
        kd
    );


    const results = [];


    /* =================================================
       DẠNG PHẲNG [1,N,C]
    ================================================= */

    if (
        sd.length === 3 &&
        bd.length === 3 &&
        kd.length === 3
    ) {

        const N =
            sd[1];


        for (
            let i = 0;
            i < N;
            i++
        ) {

            let score;


            /*
               score có thể [1]
               hoặc [2]
            */

            if (
                sd[2] === 1
            ) {

                score =
                    scores[i];

            } else {

                score =
                    Math.max(
                        scores[
                            i * sd[2]
                        ],

                        scores[
                            i * sd[2] + 1
                        ]
                    );

            }


            if (
                score <
                DET_THRESHOLD
            ) {
                continue;
            }


            /*
               2 anchors
            */

            const location =
                Math.floor(
                    i / NUM_ANCHORS
                );


            const anchor =
                i %
                NUM_ANCHORS;


            const width =
                INPUT_SIZE /
                stride;


            const x =
                location %
                width;


            const y =
                Math.floor(
                    location /
                    width
                );


            const cx =
                x * stride;

            const cy =
                y * stride;


            const bi =
                i * 4;


            const l =
                bbox[bi] *
                stride;

            const t =
                bbox[bi + 1] *
                stride;

            const r =
                bbox[bi + 2] *
                stride;

            const b =
                bbox[bi + 3] *
                stride;


            const x1 =
                cx - l;

            const y1 =
                cy - t;

            const x2 =
                cx + r;

            const y2 =
                cy + b;


            const kp =
                [];


            const ki =
                i * 10;


            for (
                let k = 0;
                k < 5;
                k++
            ) {

                const px =
                    cx +
                    kps[
                        ki + k * 2
                    ] *
                    stride;


                const py =
                    cy +
                    kps[
                        ki + k * 2 + 1
                    ] *
                    stride;


                kp.push({

                    x: px,

                    y: py

                });

            }


            results.push({

                score: score,

                x1: x1,

                y1: y1,

                x2: x2,

                y2: y2,

                points: kp

            });

        }


        return results;

    }


    /* =================================================
       DẠNG NCHW [1,C,H,W]
    ================================================= */

    if (
        sd.length === 4
    ) {

        const C =
            sd[1];

        const H =
            sd[2];

        const W =
            sd[3];


        const area =
            H * W;


        const anchors =
            C >= 2
                ? 2
                : 1;


        for (
            let y = 0;
            y < H;
            y++
        ) {

            for (
                let x = 0;
                x < W;
                x++
            ) {

                for (
                    let a = 0;
                    a < anchors;
                    a++
                ) {

                    const index =
                        a *
                        area +
                        y *
                        W +
                        x;


                    const score =
                        scores[index];


                    if (
                        score <
                        DET_THRESHOLD
                    ) {
                        continue;
                    }


                    const cx =
                        x * stride;

                    const cy =
                        y * stride;


                    const base =
                        a *
                        4 *
                        area +
                        y *
                        W +
                        x;


                    const l =
                        bbox[
                            base
                        ] *
                        stride;


                    const t =
                        bbox[
                            base +
                            area
                        ] *
                        stride;


                    const r =
                        bbox[
                            base +
                            area * 2
                        ] *
                        stride;


                    const b =
                        bbox[
                            base +
                            area * 3
                        ] *
                        stride;


                    const kp =
                        [];


                    const kpBase =
                        a *
                        10 *
                        area +
                        y *
                        W +
                        x;


                    for (
                        let k = 0;
                        k < 5;
                        k++
                    ) {

                        const px =
                            cx +
                            kps[
                                kpBase +
                                k * 2 *
                                area
                            ] *
                            stride;


                        const py =
                            cy +
                            kps[
                                kpBase +
                                (k * 2 + 1) *
                                area
                            ] *
                            stride;


                        kp.push({

                            x: px,

                            y: py

                        });

                    }


                    results.push({

                        score: score,

                        x1: cx - l,

                        y1: cy - t,

                        x2: cx + r,

                        y2: cy + b,

                        points: kp

                    });

                }

            }

        }

    }


    return results;

}


/* =====================================================
   IOU
===================================================== */

function iou(a, b) {

    const x1 =
        Math.max(
            a.x1,
            b.x1
        );

    const y1 =
        Math.max(
            a.y1,
            b.y1
        );

    const x2 =
        Math.min(
            a.x2,
            b.x2
        );

    const y2 =
        Math.min(
            a.y2,
            b.y2
        );


    const w =
        Math.max(
            0,
            x2 - x1
        );

    const h =
        Math.max(
            0,
            y2 - y1
        );


    const inter =
        w * h;


    const areaA =
        Math.max(
            0,
            a.x2 - a.x1
        ) *
        Math.max(
            0,
            a.y2 - a.y1
        );


    const areaB =
        Math.max(
            0,
            b.x2 - b.x1
        ) *
        Math.max(
            0,
            b.y2 - b.y1
        );


    return inter /
        (
            areaA +
            areaB -
            inter +
            1e-6
        );

}


/* =====================================================
   NMS
===================================================== */

function nms(boxes) {

    boxes.sort(
        (a, b) =>
            b.score -
            a.score
    );


    const keep = [];


    while (
        boxes.length > 0
    ) {

        const best =
            boxes.shift();


        keep.push(best);


        boxes =
            boxes.filter(

                box =>
                    iou(
                        best,
                        box
                    ) <
                    NMS_THRESHOLD

            );

    }


    return keep;

}


/* =====================================================
   DETECT FACE
===================================================== */

async function detectFace() {

    const inputInfo =
        makeInput(video);


    const tensor =
        canvasToTensor(
            inputInfo.canvas
        );


    const inputName =
        scrfdSession.inputNames[0];


    const outputs =
        await scrfdSession.run({

            [inputName]:
                tensor

        });


    console.log(
        "===== SCRFD OUTPUT SHAPES ====="
    );


    for (
        const name of
        Object.keys(outputs)
    ) {

        console.log(

            name,

            "dims =",
            outputs[name].dims,

            "length =",
            outputs[name]
                .data.length

        );

    }


    console.log(
        "==============================="
    );


    const allFaces = [];


    for (
        const stride
        of STRIDES
    ) {

        const score =
            getOutput(
                outputs,
                "score_" +
                stride
            );


        const bbox =
            getOutput(
                outputs,
                "bbox_" +
                stride
            );


        const kps =
            getOutput(
                outputs,
                "kps_" +
                stride
            );


        if (
            score &&
            bbox &&
            kps
        ) {

            const faces =
                decodeSCRFDLayer(

                    score,

                    bbox,

                    kps,

                    stride

                );


            allFaces.push(
                ...faces
            );

        }

    }


    return {

        faces:
            nms(allFaces),

        inputInfo:
            inputInfo

    };

}


/* =====================================================
   CHUYỂN TỌA ĐỘ
===================================================== */

function toCameraPoint(
    x,
    y,
    inputInfo
) {

    return {

        x:
            (x -
             inputInfo.dx) /
            inputInfo.scale,

        y:
            (y -
             inputInfo.dy) /
            inputInfo.scale

    };

}


/* =====================================================
   VẼ FACE
===================================================== */

function drawFace(
    face,
    inputInfo
) {

    ctx.clearRect(

        0,
        0,
        canvas.width,
        canvas.height

    );


    const p1 =
        toCameraPoint(
            face.x1,
            face.y1,
            inputInfo
        );


    const p2 =
        toCameraPoint(
            face.x2,
            face.y2,
            inputInfo
        );


    ctx.strokeStyle =
        "#00ff55";

    ctx.lineWidth = 4;


    ctx.strokeRect(

        p1.x,
        p1.y,

        p2.x - p1.x,
        p2.y - p1.y

    );


    ctx.fillStyle =
        "#00ff55";


    for (
        const point
        of face.points
    ) {

        const p =
            toCameraPoint(

                point.x,
                point.y,
                inputInfo

            );


        ctx.beginPath();


        ctx.arc(

            p.x,
            p.y,

            5,

            0,
            Math.PI * 2

        );


        ctx.fill();

    }

}


/* =====================================================
   CROP KHUÔN MẶT
===================================================== */

function cropFace(
    face,
    inputInfo
) {

    const source =
        inputInfo.canvas;


    let x1 =
        Math.max(
            0,
            face.x1
        );

    let y1 =
        Math.max(
            0,
            face.y1
        );

    let x2 =
        Math.min(
            INPUT_SIZE,
            face.x2
        );

    let y2 =
        Math.min(
            INPUT_SIZE,
            face.y2
        );


    const w =
        x2 - x1;

    const h =
        y2 - y1;


    if (
        w <= 10 ||
        h <= 10
    ) {

        return null;

    }


    /*
       Mở rộng box thêm 25%
       để ArcFace có đủ trán,
       cằm và hai bên mặt.
    */

    const padX =
        w * 0.25;

    const padY =
        h * 0.25;


    x1 =
        Math.max(
            0,
            x1 - padX
        );

    y1 =
        Math.max(
            0,
            y1 - padY
        );

    x2 =
        Math.min(
            INPUT_SIZE,
            x2 + padX
        );

    y2 =
        Math.min(
            INPUT_SIZE,
            y2 + padY
        );


    const out =
        document.createElement(
            "canvas"
        );


    out.width =
        FACE_SIZE;

    out.height =
        FACE_SIZE;


    const g =
        out.getContext("2d");


    g.drawImage(

        source,

        x1,
        y1,

        x2 - x1,
        y2 - y1,

        0,
        0,

        FACE_SIZE,
        FACE_SIZE

    );


    return out;

}


/* =====================================================
   ARCFACE TENSOR
===================================================== */

function faceToTensor(
    faceCanvas
) {

    const g =
        faceCanvas.getContext(
            "2d"
        );


    const image =
        g.getImageData(

            0,
            0,

            FACE_SIZE,
            FACE_SIZE

        );


    const area =
        FACE_SIZE *
        FACE_SIZE;


    const data =
        new Float32Array(
            area * 3
        );


    let p = 0;


    for (
        let y = 0;
        y < FACE_SIZE;
        y++
    ) {

        for (
            let x = 0;
            x < FACE_SIZE;
            x++
        ) {

            const i =
                (
                    y *
                    FACE_SIZE +
                    x
                ) * 4;


            const r =
                image.data[i];

            const g =
                image.data[i + 1];

            const b =
                image.data[i + 2];


            data[p] =
                (
                    r -
                    127.5
                ) /
                127.5;


            data[
                area + p
            ] =
                (
                    g -
                    127.5
                ) /
                127.5;


            data[
                area * 2 + p
            ] =
                (
                    b -
                    127.5
                ) /
                127.5;


            p++;

        }

    }


    return new ort.Tensor(

        "float32",

        data,

        [
            1,
            3,
            FACE_SIZE,
            FACE_SIZE
        ]

    );

}


/* =====================================================
   COSINE NORMALIZE
===================================================== */

function normalizeEmbedding(
    embedding
) {

    let sum = 0;


    for (
        let i = 0;
        i < embedding.length;
        i++
    ) {

        sum +=
            embedding[i] *
            embedding[i];

    }


    const norm =
        Math.sqrt(sum);


    const result =
        new Float32Array(
            embedding.length
        );


    for (
        let i = 0;
        i < embedding.length;
        i++
    ) {

        result[i] =
            embedding[i] /
            (
                norm ||
                1
            );

    }


    return result;

}


/* =====================================================
   ARCFACE EMBEDDING
===================================================== */

async function createEmbedding(
    faceCanvas
) {

    const tensor =
        faceToTensor(
            faceCanvas
        );


    const inputName =
        arcfaceSession.inputNames[0];


    const outputs =
        await arcfaceSession.run({

            [inputName]:
                tensor

        });


    const outputName =
        arcfaceSession.outputNames[0];


    const raw =
        outputs[
            outputName
        ].data;


    const embedding =
        normalizeEmbedding(
            raw
        );


    return embedding;

}


/* =====================================================
   EMBEDDING PREVIEW
===================================================== */

function embeddingPreview(
    embedding
) {

    if (!embedding) {
        return "";
    }


    return Array.from(
        embedding
    )
    .slice(0, 8)
    .map(
        x =>
            Number(x)
            .toFixed(4)
    )
    .join(", ");

}


/* =====================================================
   MAIN PROCESS
===================================================== */

async function processFrame() {

    if (!running) {
        return;
    }


    if (
        !processing &&
        video.readyState >= 2
    ) {

        processing = true;


        try {

            const result =
                await detectFace();


            if (
                result.faces.length === 0
            ) {

                ctx.clearRect(

                    0,
                    0,

                    canvas.width,
                    canvas.height

                );


                setStatus(

                    "🔍 ĐANG TÌM KHUÔN MẶT...",

                    "#00ff66"

                );


                setResult(

                    "Đưa khuôn mặt vào giữa camera."

                );

            }

            else {

                /*
                   Lấy khuôn mặt lớn nhất
                */

                result.faces.sort(

                    (a, b) => {

                        const areaA =
                            (
                                a.x2 -
                                a.x1
                            ) *
                            (
                                a.y2 -
                                a.y1
                            );


                        const areaB =
                            (
                                b.x2 -
                                b.x1
                            ) *
                            (
                                b.y2 -
                                b.y1
                            );


                        return areaB -
                            areaA;

                    }

                );


                const face =
                    result.faces[0];


                drawFace(

                    face,

                    result.inputInfo

                );


                setStatus(

                    "✅ ĐÃ PHÁT HIỆN " +
                    result.faces.length +
                    " KHUÔN MẶT",

                    "#00ff66"

                );


                /*
                   Crop khuôn mặt
                */

                const faceCanvas =
                    cropFace(

                        face,

                        result.inputInfo

                    );


                if (
                    faceCanvas
                ) {

                    try {

                        /*
                           ArcFace
                        */

                        const embedding =
                            await createEmbedding(
                                faceCanvas
                            );


                        lastEmbedding =
                            embedding;


                        console.log(
                            "================================"
                        );

                        console.log(
                            "ARCFACE EMBEDDING"
                        );

                        console.log(
                            "DIMENSION:",
                            embedding.length
                        );

                        console.log(
                            "VECTOR:",
                            embedding
                        );

                        console.log(
                            "PREVIEW:",
                            embeddingPreview(
                                embedding
                            )
                        );

                        console.log(
                            "================================"
                        );


                        setResult(

                            "<span class='success'>" +

                            "🟢 <b>ARCFACE HOẠT ĐỘNG</b>" +

                            "</span><br>" +

                            "Face ID: <b>ĐÃ TẠO</b><br>" +

                            "Embedding: <b>" +

                            embedding.length +

                            " chiều</b><br>" +

                            "<span style='font-size:13px;color:#888'>" +

                            embeddingPreview(
                                embedding
                            ) +

                            "..." +

                            "</span>"

                        );

                    }

                    catch (error) {

                        console.error(
                            "ArcFace ERROR:",
                            error
                        );


                        setResult(

                            "<span class='error'>" +

                            "❌ ARCFACE LỖI<br>" +

                            error.message +

                            "</span>"

                        );

                    }

                }

            }

        }

        catch (error) {

            console.error(
                "SCRFD ERROR:",
                error
            );


            setStatus(

                "❌ LỖI NHẬN DIỆN",

                "#ff4444"

            );


            setResult(

                "<span class='error'>" +

                error.message +

                "</span>"

            );

        }


        processing = false;

    }


    requestAnimationFrame(
        processFrame
    );

}


/* =====================================================
   KHỞI ĐỘNG MODEL
===================================================== */

loadModels();
