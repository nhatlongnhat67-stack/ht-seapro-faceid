<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HT SEAPRO - FACE ID</title>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.0/dist/ort.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0f17;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 25px 0 8px;
  color: #1683ff;
  font-size: 30px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 20px;
}

.camera-box {
  position: relative;
  width: 92%;
  max-width: 700px;
  margin: auto;
  background: #000;
  border-radius: 20px;
  overflow: hidden;
}

video {
  width: 100%;
  display: block;
  transform: scaleX(-1);
}

canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  transform: scaleX(-1);
}

#status {
  margin: 20px;
  min-height: 30px;
  font-size: 18px;
}

.ok {
  color: #00e676;
}

.error {
  color: #ff5252;
}

.info {
  color: #ffd54f;
}

button {
  padding: 15px 35px;
  border: 0;
  border-radius: 12px;
  background: #0066ff;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1683ff;
}

</style>

</head>

<body>

<h1>HT SEAPRO</h1>

<div class="subtitle">
HỆ THỐNG ĐIỂM DANH NHẬN DIỆN KHUÔN MẶT
</div>

<div class="camera-box">

  <video
    id="camera"
    autoplay
    playsinline>
  </video>

  <canvas id="overlay"></canvas>

</div>

<div id="status" class="info">
⏳ Sẵn sàng
</div>

<button onclick="startSystem()">
📷 BẬT CAMERA
</button>


<script>

const MODEL_PATH =
  "./model/scrfd_500m_one.onnx";

const MODEL_SIZE = 640;

let video = null;
let canvas = null;
let ctx = null;

let session = null;


/* =========================
   STATUS
========================= */

function setStatus(text, type = "info") {

  const status =
    document.getElementById("status");

  status.textContent = text;

  status.className = type;
}


/* =========================
   CAMERA
========================= */

async function startCamera() {

  video =
    document.getElementById("camera");

  setStatus(
    "⏳ Đang mở camera...",
    "info"
  );

  const stream =
    await navigator.mediaDevices.getUserMedia({

      video: {
        facingMode: "user",

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        }
      },

      audio: false

    });

  video.srcObject = stream;

  await new Promise(resolve => {

    video.onloadedmetadata = resolve;

  });

  await video.play();

  canvas =
    document.getElementById("overlay");

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  ctx =
    canvas.getContext("2d");

  console.log(
    "CAMERA SIZE:",
    video.videoWidth,
    video.videoHeight
  );

}


/* =========================
   LOAD SCRFD
========================= */

async function loadSCRFD() {

  setStatus(
    "⏳ Đang tải SCRFD...",
    "info"
  );

  /*
   * Dùng WASM để tương thích
   * Chrome / Edge / Android / iPhone
   */

  ort.env.wasm.numThreads = 1;

  session =
    await ort.InferenceSession.create(

      MODEL_PATH,

      {
        executionProviders: [
          "wasm"
        ]
      }

    );


  /*
   * CHỈ đọc inputNames
   * và outputNames.
   *
   * Không dùng session.inputs
   */

  console.log(
    "=============================="
  );

  console.log(
    "SCRFD INPUT NAMES:"
  );

  console.log(
    session.inputNames
  );


  console.log(
    "SCRFD OUTPUT NAMES:"
  );

  console.log(
    session.outputNames
  );


  console.log(
    "=============================="
  );


  setStatus(
    "✅ SCRFD ĐÃ TẢI",
    "ok"
  );

}


/* =========================
   TẠO INPUT 640x640
========================= */

function createInputTensor() {

  const size =
    MODEL_SIZE;

  const tempCanvas =
    document.createElement("canvas");

  tempCanvas.width =
    size;

  tempCanvas.height =
    size;

  const tempCtx =
    tempCanvas.getContext("2d");


  /*
   * Lấy hình camera
   */

  tempCtx.drawImage(

    video,

    0,
    0,

    size,
    size

  );


  const imageData =
    tempCtx.getImageData(

      0,
      0,

      size,
      size

    );


  const area =
    size * size;


  const data =
    new Float32Array(
      3 * area
    );


  /*
   * RGB → NCHW
   *
   * Normalize SCRFD
   */

  for (
    let i = 0;
    i < area;
    i++
  ) {

    const r =
      imageData.data[
        i * 4
      ];

    const g =
      imageData.data[
        i * 4 + 1
      ];

    const b =
      imageData.data[
        i * 4 + 2
      ];


    data[i] =
      (r - 127.5) / 128.0;


    data[area + i] =
      (g - 127.5) / 128.0;


    data[
      area * 2 + i
    ] =
      (b - 127.5) / 128.0;

  }


  return new ort.Tensor(

    "float32",

    data,

    [
      1,
      3,
      size,
      size
    ]

  );

}


/* =========================
   CHẠY SCRFD
========================= */

async function runSCRFD() {

  if (!session) {

    throw new Error(
      "SCRFD chưa được tải"
    );

  }


  const tensor =
    createInputTensor();


  /*
   * Lấy tên input thật
   * từ chính model
   */

  const inputName =
    session.inputNames[0];


  console.log(
    "INPUT ĐƯỢC SỬ DỤNG:",
    inputName
  );


  /*
   * Chạy ONNX
   */

  const outputs =
    await session.run({

      [inputName]:
        tensor

    });


  console.log(
    "SCRFD ĐÃ INFERENCE"
  );


  console.log(
    "OUTPUT:",
    outputs
  );


  /*
   * In thông tin từng output
   */

  session.outputNames.forEach(
    name => {

      const result =
        outputs[name];

      if (!result) {

        console.warn(
          "Không tìm thấy output:",
          name
        );

        return;

      }

      console.log(
        "OUTPUT:",
        name,
        "DIMS:",
        result.dims,
        "DATA:",
        result.data.length
      );

    }
  );


  setStatus(
    "✅ SCRFD ĐÃ CHẠY INFERENCE",
    "ok"
  );

}


/* =========================
   START
========================= */

async function startSystem() {

  try {

    setStatus(
      "⏳ Đang khởi động...",
      "info"
    );


    await startCamera();


    await loadSCRFD();


    await runSCRFD();


  } catch (error) {

    console.error(
      "FACE ID ERROR:",
      error
    );


    setStatus(
      "❌ LỖI: " +
      error.message,
      "error"
    );

  }

}

</script>

</body>
</html>
